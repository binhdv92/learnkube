apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-name
  labels:
    key: pod-label
spec:
  replicas: 2 
  selector:
    matchLabels:
      key: pod-label
  template:
    metadata:
      labels:
        key: pod-label
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: container-name
          image: server.example.com:5000/first-k8s-app:v2
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: service-name
spec:
  selector:
    key: pod-label
  ports:
    - port: 8080
      targetPort: 80
  type: NodePort

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-name
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: service-name
                port:
                  number: 8080
