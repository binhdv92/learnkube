
apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    run: mypod
spec:
  serviceAccountName: fundamentals-challenge # <- this service account
  containers:
  - name: c1
    image: ghcr.io/learnk8s/labs-fundamentals:surfing
    ports:
    - containerPort: 4567
---
apiVersion: v1
kind: Service
metadata:
  name: service-mypod
spec:
  ports:
  - port: 80
    targetPort: 4567
  selector:
    run: mypod
  type: ClusterIP
--- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-mypod
spec:
  rules:
  - http:
      paths:
      - path: /v13
        pathType: Prefix
        backend:
          service:
            name: service-mypod
            port:
              number: 80