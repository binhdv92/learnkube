apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydep-13-4
  labels:
    run: mydep-13-4
spec:
  replicas: 2
  selector:
    matchLabels:
      run: mydep-13-4
  template:
    metadata:
      labels:
        run: mydep-13-4
    spec:
      serviceAccountName: fundamentals-challenge # <- this service account
      containers:
      - name: c1
        image: ghcr.io/learnk8s/labs-fundamentals:basics
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-mydep-13-4
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    run: mydep-13-4
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-mydep-13-4
spec:
  rules:
  - http:
      paths:
      - path: /v13-4
        pathType: Prefix
        backend:
          service:
            name: service-mydep-13-4
            port:
              number: 80