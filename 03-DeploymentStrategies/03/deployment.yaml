apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-app-03-03
spec:
  selector:
    matchLabels:
      name: app-03-03
  template:
    metadata:
      labels:
        name: app-03-03
    spec:
      containers:
      - name: web
        image: ghcr.io/learnk8s/deployment-strategies:1.0.0
        ports:
          - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-app-03-03
spec:
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
  selector:
    name: app-03-03
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-03-03
spec:
  rules:
  - http:
      paths:
      - path: /03-03
        pathType: Prefix
        backend:
          service:
            name: service-app-03-03
            port:
              number: 80