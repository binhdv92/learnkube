apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-hello-world
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: ghcr.io/learnk8s/podinfo:2026.08
        ports:
        - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: service-hello-world
spec:
  selector:
    app: hello
  ports:
  - protocol: TCP
    port: 80
    targetPort: 9898
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hello-world
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-hello-world
            port:
              number: 80